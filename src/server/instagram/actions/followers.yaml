name: instagram-followers
description: Open followers dialog and extract follower list
actions:
  - id: clickFollowersButton
    action: click
    selector: "//a[.//span[contains(translate(text(), 'FOLLOWERS', 'followers'), 'followers')]]"
    waitAfter: 2000

  - id: waitForFollowersDialog
    action: wait
    selector: "div[role='dialog']"
    timeout: 10000

  - id: waitForListLoad
    action: waitFor
    timeout: 5000

  - id: finalExtract
    action: javascript
    script: >
      const dialog = document.querySelector('div[role="dialog"]');
      if (!dialog) return [];
      const rows = dialog.querySelectorAll('div.x1qnrgzn');
      return Array.from(rows).map(row => {
        const usernameEl = row.querySelector('span._aad7');
        const imgEl = row.querySelector('img[alt*="profile picture"]');
        return {
          username: usernameEl ? usernameEl.textContent.trim() : '',
          avatarUrl: imgEl ? imgEl.getAttribute('src') : ''
        };
      }).filter(item => item.username);
