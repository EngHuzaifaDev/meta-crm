name: instagram-login
description: Login to Instagram with 2FA handling
baseUrl: "https://www.instagram.com"
actions:
  - id: navigateToLogin
    action: navigate
    url: "https://www.instagram.com/accounts/login/"
    waitAfter: 2000

  - id: waitForLoginForm
    action: wait
    selector: "input[name='email']"
    timeout: 15000

  - id: fillUsername
    action: type
    selector: "input[name='email']"
    value: "{credentials.username}"

  - id: fillPassword
    action: type
    selector: "input[name='pass']"
    value: "{credentials.password}"

  - id: clickLoginButton
    action: javascript
    script: |
      const spans = document.querySelectorAll('span');
      for (const s of spans) {
        if (s.textContent.trim() === 'Log in') {
          let el = s;
          while (el.parentElement && el.parentElement.tagName !== 'BODY') {
            if (el.parentElement.querySelector('[data-visualcompletion="ignore"]')) {
              el.parentElement.click();
              return;
            }
            el = el.parentElement;
          }
        }
      }
    waitAfter: 4000

  - id: fillVerificationCode
    action: type
    value: "{credentials.verificationCode}"
    waitAfter: 1000

  - id: clickVerify
    action: javascript
    script: |
      const spans = document.querySelectorAll('span');
      for (const s of spans) {
        if (s.textContent.trim() === 'Log in') {
          let el = s;
          while (el.parentElement && el.parentElement.tagName !== 'BODY') {
            if (el.parentElement.querySelector('[data-visualcompletion="ignore"]')) {
              el.parentElement.click();
              return;
            }
            el = el.parentElement;
          }
        }
      }
    waitAfter: 3000

  - id: dismissSaveInfo
    action: clickIfExists
    selector: "//span[contains(translate(text(),'NOT','not'), 'not')]/ancestor::div[@role='button']"
    waitAfter: 1500

  - id: dismissNotifications
    action: clickIfExists
    selector: "//span[contains(translate(text(),'NOT','not'), 'not')]/ancestor::button"
    waitAfter: 1500

  - id: waitForFeed
    action: wait
    selector: "section main"
    timeout: 15000
