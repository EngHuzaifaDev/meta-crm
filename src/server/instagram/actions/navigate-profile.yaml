name: instagram-navigate-profile
description: Navigate to a specific Instagram profile
actions:
  - id: navigateToProfile
    action: navigate
    url: "https://www.instagram.com/{profile.username}/"
    waitAfter: 3000

  - id: checkProfileError
    action: ifExists
    selector: "//span[text()=\"Sorry, this page isn't available.\"]"
    timeout: 5000
    then:
      - id: profileNotFound
        action: javascript
        script: "return { error: 'PROFILE_NOT_FOUND', username: arguments[0] }"
        value: "{profile.username}"

  - id: checkPrivateProfile
    action: ifExists
    selector: "//span[contains(text(), 'This profile is private')]"
    timeout: 5000
    then:
      - id: profileIsPrivate
        action: javascript
        script: "return { error: 'PROFILE_IS_PRIVATE', username: arguments[0] }"
        value: "{profile.username}"

  - id: waitForProfilePage
    action: wait
    selector: "header section"
    timeout: 10000

  - id: extractProfilePic
    action: javascript
    script: "const img = document.querySelector('header img[alt*=\"profile picture\"]'); return img ? img.src : ''"
