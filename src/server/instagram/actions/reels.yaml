name: instagram-reels-scroll
description: Scroll through a few reels to simulate human activity
actions:
  - id: navigateToReels
    action: navigate
    url: "https://www.instagram.com/reels/"
    waitAfter: 3000

  - id: waitForReel
    action: wait
    selector: "article"
    timeout: 15000
    waitAfter: 2000

  - id: scrollReels
    action: repeat
    maxIterations: 5
    actions:
      - id: watchReel
        action: waitFor
        timeout: 4000
        waitAfter: 1000

      - id: likeReel
        action: clickIfExists
        selector: "//span[@role='button' and .//svg[@aria-label='Like']]"
        waitAfter: 1000

      - id: scrollNextReel
        action: javascript
        script: |
          const reels = document.querySelectorAll('video');
          if (reels.length > 0) {
            const last = reels[reels.length - 1];
            last.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        waitAfter: 2000
