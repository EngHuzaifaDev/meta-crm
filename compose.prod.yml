services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: metaCRM-app-prod
    ports:
      - "3004:3004"
    env_file:
      - .env.production
    environment:
      - PORT=3004
    restart: unless-stopped
    networks:
      - app-network
      - mongodb-network

networks:
  app-network:
    driver: bridge
  mongodb-network:
    external: true
