services:
  selenium-hub:
    image: selenium/hub:4.27.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - selenium-network
    restart: unless-stopped

  chrome:
    image: selenium/node-chrome:4.27.0
    container_name: selenium-node-chrome
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
    networks:
      - selenium-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: metaCRM-app-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - SELENIUM_GRID_URL=http://selenium-hub:4444
    depends_on:
      - selenium-hub
    restart: unless-stopped
    networks:
      - app-network
      - mongodb-network
      - selenium-network

networks:
  app-network:
    driver: bridge
  mongodb-network:
    external: true
  selenium-network:
    driver: bridge
