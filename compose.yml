services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meta-crm-dev
    ports:
      - "3003:3003"
    env_file:
      - .env
      - .env.local
    environment:
      - PORT=3003
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - app-network
      - mongodb-network
      - selenium-network

networks:
  app-network:
    driver: bridge
  mongodb-network:
    external: true
  selenium-network:
    external: true
    name: autolog_selenium_public
